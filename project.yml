name: OnPitch
options:
  bundleIdPrefix: ru.ementis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
knownRegions:
  - en
  - ru
  - Base
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: 2.2.0
targets:
  OnPitch:
    type: application
    platform: iOS
    sources:
      - path: OnPitch
        excludes:
          - "**/Info.plist"
          - "**/DesignRef/**"
          - "**/.DS_Store"
    resources:
      - path: OnPitch/Resources/Assets.xcassets
      - path: OnPitch/Resources/Fonts
      - path: OnPitch/Resources/Localizable.xcstrings
      - path: OnPitch/Resources/InfoPlist.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ementis.onpitch
        PRODUCT_NAME: onPitch
        PRODUCT_MODULE_NAME: OnPitch
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: OnPitch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: onPitch
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "4PPZFZHK5J"
        SWIFT_EMIT_LOC_STRINGS: true
        LOCALIZATION_PREFERS_STRING_CATALOGS: true
        ENABLE_PREVIEWS: true
        ENABLE_TESTABILITY: true
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
    scheme:
      testTargets:
        - OnPitchTests
  OnPitchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OnPitchTests
    dependencies:
      - target: OnPitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ementis.onpitch.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/onPitch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/onPitch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
